benchmark:
  name: demo_suite_forward_waypoints
  seed: 42
  backend: mujoco
  headless: true
  use_sim_time: true
  output_dir: results/demo_suite

environment:
  name: extreme_lab
  map_frame: map
  robot_frame: base_footprint
  bounds:
    x_min: -4.35
    x_max: 4.35
    y_min: -3.0
    y_max: 3.0

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.35
  max_speed_mps: 0.50
  goal_tolerance_m: 0.55
  max_goal_time_s: 45.0

people:
  count: 0
  radius_m: 0.30

goals:
  count: 2
  mode: fixed
  fixed:
    - {x: 1.5, y: 0.0, yaw: 0.0}
    - {x: 3.0, y: 0.0, yaw: 0.0}
  min_distance_between_goals_m: 1.0
  min_distance_from_walls_m: 0.75
  max_sampling_attempts: 30
  path_validation_timeout_s: 1.5

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10
