name: Bug report
description: Reproducible Go2 simulation, radiation mapping, terrain or tooling failure
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Command and reproduction steps
      description: Include the command, seed, dose budget, rate limit, GP likelihood and flags.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment and evidence
      description: Commit/patch status, Docker image ID, host/GPU, relevant log excerpts and artifact paths. Remove credentials before posting.
  - type: dropdown
    attributes:
      label: Run type
      options:
        - Radiation mapping and dose-constrained exploration
        - Online GP prediction or uncertainty
        - Go2 locomotion or terrain traversal
        - ROS or planar navigation integration
        - Build or CI tooling
        - Other
