g1_base_approach:
  ros__parameters:
    # This enters the workspace's human-aware command filtering pipeline.
    cmd_vel_topic: "/cmd_vel"
    base_frame: "base_footprint"
    min_speed_x_mps: 0.20
    min_speed_y_mps: 0.25
    max_speed_x_mps: 0.40
    max_speed_y_mps: 0.35
    max_yaw_rate_rps: 0.60
    speed_per_m: 1.0
    yaw_rate_per_rad: 1.0
    retreat_speed_mps: 0.30
    settle_s: 1.0
    cmd_rate_hz: 20.0
    target_x_m: 0.270
    target_y_m: -0.220
    standoff_object_ids: ["drop_pad"]
    standoff_target_x_m: [0.350]
    forward_tolerance_m: 0.050
    lateral_tolerance_m: 0.040
    heading_tolerance_rad: 0.350
    min_forward_m: 0.050
    object_timeout_ms: 1500.0
    lookup_grace_s: 3.0
    default_timeout_s: 900.0
