benchmark:
  name: extreme_lab_random_waypoint_locomotion
  seed: 42
  backend: mujoco
  headless: true
  use_sim_time: true
  output_dir: results/extreme_lab_locomotion

environment:
  name: extreme_lab
  map_frame: map
  robot_frame: base_footprint
  bounds:
    x_min: -4.35
    x_max: 4.35
    y_min: -3.0
    y_max: 3.0

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.15
  max_speed_mps: 0.15
  goal_tolerance_m: 0.55
  max_goal_time_s: 90.0

people:
  count: 0
  radius_m: 0.30

goals:
  count: 5
  mode: random
  min_distance_between_goals_m: 1.5
  min_distance_from_walls_m: 0.75
  max_sampling_attempts: 30
  path_validation_timeout_s: 1.5

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10
