# Unitree's G1 simulator and real robot are controlled through the Unitree SDK2 DDS API.
# Keep controllers targeting these interfaces so simulation and hardware stay aligned.
unitree_g1_interfaces:
  low_state: rt/lowstate
  low_command: rt/lowcmd
  high_state: rt/sportmodestate
  high_command: rt/sportmoderequest
  ros_domain_id: 42
  rmw: rmw_cyclonedds_cpp

simulated_sensors:
  realsense_d435i:
    color_image: /camera/camera/color/image_raw
    color_info: /camera/camera/color/camera_info
    depth_image: /camera/camera/depth/image_rect_raw
    depth_info: /camera/camera/depth/camera_info
    imu: /camera/camera/imu
  livox:
    pointcloud: /livox/lidar

control_notes:
  - Use unitree_sdk2/unitree_ros2 message definitions for low-level motor commands.
  - Test controllers against Mujoco first, then run unchanged against hardware after setting the real network interface in CycloneDDS.
  - Do not run high-gain or unbounded controllers on hardware without Unitree's safety procedures.
