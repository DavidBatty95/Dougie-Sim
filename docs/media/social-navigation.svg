<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic social waypoints</title>
  <desc id="desc">Goals and people are interpreted in the observed map. Schematic illustration, not recorded benchmark footage.</desc>
  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .flow {stroke-dasharray:8 9;animation:flow 1.4s linear infinite}
    .pulse {animation:pulse 2.4s ease-in-out infinite}
    @keyframes flow {to {stroke-dashoffset:-34}}
    @keyframes pulse {0%,100% {opacity:.45} 50% {opacity:1}}
    @media (prefers-reduced-motion:reduce) {.flow,.pulse {animation:none}}
  </style>
  <rect width="1200" height="330" rx="18" fill="#0b1727"/>
  <text x="34" y="53" fill="#edf6ff" font-size="32" font-weight="bold">Dynamic social waypoints</text>
  <text x="35" y="85" fill="#a8c1d6" font-size="17">Goals and people are interpreted in the observed map</text>
  <rect x="35" y="119" width="340" height="144" rx="12" fill="#14273b" stroke="#43d2ec"/>
  <circle class="pulse" cx="57" cy="146" r="5" fill="#43d2ec"/>
  <text x="73" y="153" fill="#43d2ec" font-size="21" font-weight="bold">Observe the crowd</text>
  <text x="53" y="192" fill="#edf6ff" font-size="16">Green: tracked / amber: lost</text>
  <text x="53" y="229" fill="#acc2d6" font-size="14">Bounded display persistence; real timestamps</text>
  <path class="flow" d="M381 192h40" stroke="#43d2ec" stroke-width="3"/><path d="M414 187l8 5-8 5" fill="none" stroke="#43d2ec" stroke-width="2"/>
  <rect x="430" y="119" width="340" height="144" rx="12" fill="#14273b" stroke="#7de39a"/>
  <circle class="pulse" cx="452" cy="146" r="5" fill="#7de39a"/>
  <text x="468" y="153" fill="#7de39a" font-size="21" font-weight="bold">Choose motion</text>
  <text x="448" y="192" fill="#edf6ff" font-size="16">Green path; blue/red alternatives</text>
  <text x="448" y="229" fill="#acc2d6" font-size="14">Cyan: final safety output; visible reasons</text>
  <path class="flow" d="M776 192h40" stroke="#43d2ec" stroke-width="3"/><path d="M809 187l8 5-8 5" fill="none" stroke="#43d2ec" stroke-width="2"/>
  <rect x="825" y="119" width="340" height="144" rx="12" fill="#14273b" stroke="#d3a5ff"/>
  <circle class="pulse" cx="847" cy="146" r="5" fill="#d3a5ff"/>
  <text x="863" y="153" fill="#d3a5ff" font-size="21" font-weight="bold">Advance goals</text>
  <text x="843" y="192" fill="#edf6ff" font-size="16">Prepare a connected free-space target</text>
  <text x="843" y="229" fill="#acc2d6" font-size="14">Switch at &lt;= 0.50 m; wait if none is valid</text>
  <text x="35" y="302" fill="#8ca8c0" font-size="13">Simulation research prototype | Illustrative data flow | See DEMO_RESULTS.md for measured outcomes</text>
</svg>
