services:
  dougie-sim:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility,compute
      # Hybrid laptops otherwise select the Intel GLX vendor and silently fall
      # back to llvmpipe inside a container without the integrated DRM device.
      __NV_PRIME_RENDER_OFFLOAD: '1'
      __GLX_VENDOR_LIBRARY_NAME: nvidia
