g1_29dof:
  model: g1
  mujoco_scene: scene_29dof.xml
  lowcmd_topic: /lowcmd
  lowstate_topic: /lowstate
  secondary_imu_topic: /secondary_imu
  joints:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - waist_roll_joint
    - waist_pitch_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint

brainco_hands:
  # Unitree's public G1 Mujoco/ROS2 examples expose hand control through the
  # unitree_hg HandCmd/HandState shape. Keep this profile isolated so true
  # BrainCo-specific firmware topics can be swapped in without touching body control.
  left_command_topic: /dex3/left/cmd
  right_command_topic: /dex3/right/cmd
  left_state_topic: /lf/dex3/left/state
  right_state_topic: /lf/dex3/right/state
  joints:
    - thumb_0
    - thumb_1
    - thumb_2
    - index_0
    - index_1
    - middle_0
    - middle_1
  left_limits:
    min: [-1.05, -0.724, 0.0, -1.57, -1.75, -1.57, -1.75]
    max: [1.05, 1.05, 1.75, 0.0, 0.0, 0.0, 0.0]
  right_limits:
    min: [-1.05, -1.05, -1.75, 0.0, 0.0, 0.0, 0.0]
    max: [1.05, 0.742, 0.0, 1.57, 1.75, 1.57, 1.75]
