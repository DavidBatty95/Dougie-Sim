name: Dougie verification
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dougie-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go2:
    name: Go2 physics and ROS integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate launch configuration
        run: |
          bash -n dougie install.sh
          docker compose config --quiet
          python3 scripts/check_dougie_docs.py
      - name: Download pinned public assets and build
        run: ./dougie setup
      - name: Physics and contract tests
        run: ./dougie test
      - name: ROS interface smoke test
        run: |
          ./dougie demo --world room --headless --duration 8
          python3 scripts/check_dougie_run.py
      - name: Dose-constrained reactor mission
        run: |
          export DOUGIE_UID="$(id -u)" DOUGIE_GID="$(id -g)"
          docker compose run --rm -T dougie-sim python3 -m dougie_sim.radiation_run \
            --headless --fast --duration 180 --dose-budget 0.2 --seed 3 \
            --output results/dougie/radiation-ci
          python3 scripts/check_dougie_radiation.py results/dougie/radiation-ci --require-return
      - name: Physical stair and uneven-ground traversal
        run: |
          export DOUGIE_UID="$(id -u)" DOUGIE_GID="$(id -g)"
          docker compose run --rm -T dougie-sim python3 scripts/probe_dougie_terrain.py \
            --output results/dougie/stairs.json
          docker compose run --rm -T dougie-sim python3 scripts/probe_dougie_terrain.py \
            --terrain uneven --output results/dougie/uneven.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dougie-test-evidence
          path: results/dougie/
          retention-days: 14
