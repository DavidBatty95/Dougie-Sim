benchmark:
  name: demo_suite_social_endurance
  seed: 42
  backend: mujoco
  headless: true
  use_sim_time: true
  total_timeout_s: 180.0
  output_dir: results/demo_suite

environment:
  name: pedestrian_plaza
  map_frame: map
  robot_frame: base_footprint
  bounds:
    x_min: -8.5
    x_max: 8.5
    y_min: -8.5
    y_max: 8.5

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.35
  max_speed_mps: 0.50
  goal_tolerance_m: 0.80
  max_goal_time_s: 75.0

people:
  count: 4
  radius_m: 0.42
  scenario: demo_endurance_plaza

goals:
  count: 4
  mode: fixed
  fixed:
    - {x: 1.65, y: 0.0, yaw: 0.0}
    - {x: 3.40, y: 0.0, yaw: 0.0}
    - {x: 4.50, y: 0.0, yaw: 0.0}
    - {x: 4.80, y: 0.0, yaw: 0.0}
  min_distance_between_goals_m: 1.5
  min_distance_from_walls_m: 0.75
  max_sampling_attempts: 30
  path_validation_timeout_s: 1.5

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10

data_health:
  odom_stale_timeout_s: 1.0
  pedestrian_stale_timeout_s: 1.0
  scan_stale_timeout_s: 1.0
  require_exact_people_count: true

data_sources:
  control_people: mujoco_truth_oracle
  scoring_people: mujoco_simulator_truth
  scan: mujoco_raycast
