schema_version: 1

experiment:
  id: oracle_social_method_development
  description: Development-only oracle comparison; not a final paper experiment
  seed_partition: development_v1
  seeds: [11, 23]
  repetitions: 1
  timeout_s: 300
  output_root: ros2_ws/src/dynamic_obstacle_benchmarks/results/batches
  require_repository_output: true

invalid_trial_policy:
  infrastructure_reasons:
    - nav2_path_not_ready_before_scoring_start
    - nav2_not_ready_or_first_goal_rejected
    - transform_unavailable:world->map

provenance:
  files:
    - id: live_wrapper
      path: scripts/run_extreme_lab_person_avoidance_benchmark.sh
    - id: benchmark_config
      path: ros2_ws/src/dynamic_obstacle_benchmarks/config/person_avoidance_benchmark.yaml
    - id: oracle_sensing_profile
      path: ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_oracle_v1.yaml
    - id: reactive_method_profile
      path: ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_method_reactive_geometric_v1.yaml
    - id: temporal_method_profile
      path: ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_method_deterministic_temporal_v1.yaml
    - id: locomotion_policy
      path: vendor/unitree_rl_lab/policies/g1_29dof_velocity_v0/policy.onnx
  repositories:
    - id: workspace
      path: .
    - id: unitree_mujoco
      path: ros2_ws/src/unitree_mujoco
  container_services: [unitree-g1-sim]

aggregation:
  confidence_level: 0.95
  bootstrap_samples: 2000
  bootstrap_seed: 91357
  reference_method: reactive_geometric
  continuous_metrics:
    - final_score
    - minimum_body_clearance_m
    - minimum_ttc_s
    - total_time_s
    - actual_path_length_m
  binary_metrics: [success, collisions, fallen, no_movement]

methods:
  - id: nav2_only
    command: [scripts/run_extreme_lab_person_avoidance_benchmark.sh]
    args:
      - --skip-build
      - --no-rviz
      - --minimum-score
      - "0"
      - --scene
      - scene_29dof_pedestrian_plaza.xml
      - --environment-name
      - pedestrian_plaza
      - --sim-arg
      - run_human_aware_motion_planner:=false
      - --sim-arg
      - run_human_collision_avoidance:=false
      - --sim-arg
      - run_dynamic_obstacle_tracker:=false
      - --sim-arg
      - cmd_vel_topic:=/cmd_vel

  - id: reactive_geometric
    command: [scripts/run_extreme_lab_person_avoidance_benchmark.sh]
    args:
      - --skip-build
      - --no-rviz
      - --minimum-score
      - "0"
      - --scene
      - scene_29dof_pedestrian_plaza.xml
      - --environment-name
      - pedestrian_plaza
      - --sim-arg
      - run_human_aware_motion_planner:=false
      - --sim-arg
      - run_human_collision_avoidance:=true
      - --sim-arg
      - human_collision_input_cmd_vel_topic:=/cmd_vel
      - --sim-arg
      - cmd_vel_topic:=/cmd_vel_safe
      - --sim-arg
      - tracker_use_sensor_input:=false
      - --sim-arg
      - social_navigation_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_oracle_v1.yaml
      - --sim-arg
      - social_navigation_method_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_method_reactive_geometric_v1.yaml

  - id: deterministic_temporal
    command: [scripts/run_extreme_lab_person_avoidance_benchmark.sh]
    args:
      - --skip-build
      - --no-rviz
      - --minimum-score
      - "0"
      - --scene
      - scene_29dof_pedestrian_plaza.xml
      - --environment-name
      - pedestrian_plaza
      - --sim-arg
      - run_human_aware_motion_planner:=false
      - --sim-arg
      - run_human_collision_avoidance:=true
      - --sim-arg
      - human_collision_input_cmd_vel_topic:=/cmd_vel
      - --sim-arg
      - cmd_vel_topic:=/cmd_vel_safe
      - --sim-arg
      - tracker_use_sensor_input:=false
      - --sim-arg
      - social_navigation_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_oracle_v1.yaml
      - --sim-arg
      - social_navigation_method_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_method_deterministic_temporal_v1.yaml

  - id: full_planner_supervisor
    command: [scripts/run_extreme_lab_person_avoidance_benchmark.sh]
    args:
      - --skip-build
      - --no-rviz
      - --minimum-score
      - "0"
      - --scene
      - scene_29dof_pedestrian_plaza.xml
      - --environment-name
      - pedestrian_plaza
      - --sim-arg
      - run_human_aware_motion_planner:=true
      - --sim-arg
      - run_human_collision_avoidance:=true
      - --sim-arg
      - human_collision_input_cmd_vel_topic:=/cmd_vel_human_aware
      - --sim-arg
      - cmd_vel_topic:=/cmd_vel_safe
      - --sim-arg
      - tracker_use_sensor_input:=false
      - --sim-arg
      - social_navigation_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_oracle_v1.yaml
      - --sim-arg
      - social_navigation_method_params_file:=/workspace/ros2_ws/src/unitree_g1_sim_bringup/config/social_navigation_method_default_v1.yaml

scenarios:
  - id: plaza_crossing_development
    args:
      - --mode
      - crossing
      - --people
      - "4"
      - --goals
      - "4"
