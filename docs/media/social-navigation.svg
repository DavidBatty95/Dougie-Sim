<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Unitree G1 social navigation storyboard</title>
  <desc id="desc">Top-down scene of a Unitree G1 using LiDAR to track six pedestrians, predict their motion, compare candidate paths, select a socially safe route to a goal, and pass the command through an independent collision supervisor that either passes the command or forces zero velocity.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --border:#d0d7de;
      --panel:#f6f8fa; --card:#ffffff; --grid:#eaeef2;
      --cyan:#087ea4; --cyan-bright:#00a7c4; --cyan-soft:#ddf4ff;
      --violet:#8250df; --violet-soft:#fbefff;
      --green:#1a7f37; --green-soft:#dafbe1;
      --amber:#9a6700; --amber-soft:#fff8c5;
      --red:#cf222e; --red-soft:#ffebe9;
      --robot:#57606a; --shadow:#1f2328;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
        --panel:#11161d; --card:#161b22; --grid:#21262d;
        --cyan:#58d6ed; --cyan-bright:#39d0e8; --cyan-soft:#0b3441;
        --violet:#bc8cff; --violet-soft:#35215d;
        --green:#3fb950; --green-soft:#12351d;
        --amber:#d29922; --amber-soft:#3d2f05;
        --red:#f85149; --red-soft:#5c1a1a;
        --robot:#b1bac4; --shadow:#000000;
      }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg) }
    .title { font-size:23px; font-weight:750 }
    .subtitle { font-size:11.5px; fill:var(--muted) }
    .section { font-size:9.5px; font-weight:750; letter-spacing:.11em }
    .name { font-size:12px; font-weight:700 }
    .detail { font-size:9.5px; fill:var(--muted) }
    .micro { font-size:8.5px; fill:var(--muted); font-weight:600 }
    .panel { fill:var(--panel); stroke:var(--border) }
    .card { fill:var(--card); stroke:var(--border) }
    .scene-grid { stroke:var(--grid); stroke-width:1 }
    .track { fill:var(--card); stroke:var(--violet); stroke-width:1.4 }
    .person-body { fill:var(--violet-soft); stroke:var(--violet); stroke-width:1.4 }
    .prediction { fill:none; stroke:var(--violet); stroke-width:1.5; stroke-dasharray:4 5; stroke-linecap:round; opacity:.72 }
    .prediction-dot { fill:var(--violet); opacity:.7 }
    .ray { stroke:var(--cyan); stroke-width:1; opacity:.25 }
    .scan-ring { fill:none; stroke:var(--cyan); stroke-width:1.2; opacity:.28 }
    .candidate { fill:none; stroke:var(--red); stroke-width:2.2; stroke-linecap:round; stroke-dasharray:6 6; opacity:.38 }
    .selected-under { fill:none; stroke:var(--bg); stroke-width:7; stroke-linecap:round; opacity:.86 }
    .selected { fill:none; stroke:var(--cyan-bright); stroke-width:4; stroke-linecap:round; stroke-linejoin:round }
    .flow { stroke-dasharray:10 10; animation:path-flow 2.4s linear infinite }
    .scan-a { animation:scan-pulse 3s ease-out infinite }
    .scan-b { animation:scan-pulse 3s ease-out 1s infinite }
    .scan-c { animation:scan-pulse 3s ease-out 2s infinite }
    .robot-motion { animation:robot-nudge 3s ease-in-out infinite }
    .future-pulse { animation:future-pulse 2.6s ease-in-out infinite }
    .state-pass { animation:state-pass 4s step-end infinite }
    .state-stop { animation:state-stop 4s step-end infinite }
    .goal-pulse { animation:goal-pulse 2.8s ease-out infinite; transform-origin:810px 272px }
    @keyframes path-flow { to { stroke-dashoffset:-20 } }
    @keyframes scan-pulse { 0% { opacity:.48; transform:scale(.82) } 75%,100% { opacity:.08; transform:scale(1.06) } }
    @keyframes robot-nudge { 0%,100% { transform:translateX(0) } 50% { transform:translateX(5px) } }
    @keyframes future-pulse { 0%,100% { opacity:.35 } 50% { opacity:.95 } }
    @keyframes goal-pulse { 0% { transform:scale(.85); opacity:.65 } 75%,100% { transform:scale(1.18); opacity:0 } }
    @keyframes state-pass { 0%,49% { opacity:1 } 50%,100% { opacity:.16 } }
    @keyframes state-stop { 0%,49%,100% { opacity:.16 } 50%,99% { opacity:1 } }
    @media (prefers-reduced-motion:reduce) {
      .flow,.scan-a,.scan-b,.scan-c,.robot-motion,.future-pulse,.state-pass,.state-stop,.goal-pulse { animation:none }
      .state-pass,.state-stop { opacity:1 }
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" class="scene-grid"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="var(--shadow)" flood-opacity=".10"/>
    </filter>
    <filter id="cyan-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--violet)"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--cyan-bright)"/>
    </marker>
    <g id="person">
      <circle r="9" class="person-body"/>
      <circle cy="-2" r="3.2" fill="var(--violet)"/>
      <path d="M-5 5Q0 1 5 5" fill="none" stroke="var(--violet)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="560" fill="var(--bg)"/>

  <text class="title" x="28" y="34">Social Navigation: From Scan to Safe Motion</text>
  <text class="subtitle" x="28" y="54">A top-down storyboard of human-aware planning with an independent final collision gate</text>
  <g transform="translate(830 25)">
    <circle cx="0" cy="0" r="4" fill="var(--cyan)"/><text class="micro" x="10" y="3">robot plan</text>
    <circle cx="92" cy="0" r="4" fill="var(--violet)"/><text class="micro" x="102" y="3">people</text>
    <circle cx="174" cy="0" r="4" fill="var(--red)"/><text class="micro" x="184" y="3">risk</text>
    <circle cx="239" cy="0" r="4" fill="var(--green)"/><text class="micro" x="249" y="3">supervised output</text>
  </g>

  <!-- Top-down navigation scene -->
  <rect class="panel" x="28" y="76" width="854" height="376" rx="12"/>
  <rect x="29" y="77" width="852" height="374" rx="11" fill="url(#grid)"/>
  <path d="M49 272H861" stroke="var(--border)" stroke-width="46" opacity=".13"/>
  <path d="M49 272H861" stroke="var(--border)" stroke-width="1" stroke-dasharray="10 12" opacity=".7"/>
  <rect x="44" y="91" width="126" height="23" rx="11.5" fill="var(--card)" stroke="var(--border)"/>
  <text class="section" x="57" y="106" fill="var(--cyan)">LIVE LOCAL SCENE</text>

  <!-- Candidate paths remain legible beneath actors -->
  <path class="candidate" d="M190 290C330 282 410 208 552 205S720 245 810 272"/>
  <path class="candidate" d="M190 290C328 304 442 366 577 351S725 291 810 272"/>
  <path class="candidate" d="M190 290C348 280 465 274 615 272S754 272 810 272"/>
  <path class="selected-under" d="M190 290C318 252 402 326 518 318C625 310 659 215 735 219C772 221 792 245 810 272"/>
  <path class="selected flow" d="M190 290C318 252 402 326 518 318C625 310 659 215 735 219C772 221 792 245 810 272" marker-end="url(#arrow-cyan)"/>
  <text class="micro" x="471" y="337" fill="var(--cyan)">selected social path</text>
  <text class="micro" x="605" y="367" fill="var(--red)">rejected candidates</text>

  <!-- LiDAR scan and detections -->
  <g transform="translate(180 290)">
    <circle class="scan-ring scan-a" r="52"/>
    <circle class="scan-ring scan-b" r="78"/>
    <circle class="scan-ring scan-c" r="104"/>
    <g class="ray">
      <path d="M0 0L206 -100"/><path d="M0 0L300 33"/><path d="M0 0L354 -121"/>
      <path d="M0 0L411 88"/><path d="M0 0L481 -61"/><path d="M0 0L540 52"/>
    </g>
  </g>
  <text class="micro" x="69" y="398" fill="var(--cyan)">LiDAR scan + detections</text>

  <!-- Clearly recognizable top-down G1 -->
  <g class="robot-motion">
    <g transform="translate(180 290) rotate(90)" filter="url(#shadow)">
      <circle cx="0" cy="-18" r="9" fill="var(--cyan-soft)" stroke="var(--cyan)" stroke-width="2"/>
      <path d="M-10-8L-13 18Q0 27 13 18L10-8Z" fill="var(--card)" stroke="var(--robot)" stroke-width="2"/>
      <rect x="-18" y="-6" width="7" height="27" rx="3.5" fill="var(--robot)" transform="rotate(12 -14 -6)"/>
      <rect x="11" y="-6" width="7" height="27" rx="3.5" fill="var(--robot)" transform="rotate(-12 14 -6)"/>
      <path d="M-7 21L-11 38M7 21L11 38" stroke="var(--robot)" stroke-width="7" stroke-linecap="round"/>
      <path d="M-11 38L-15 45M11 38L15 45" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round"/>
      <path d="M-4-20H4" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="126" y="327" width="108" height="25" rx="12.5" fill="var(--card)" stroke="var(--border)"/>
  <text class="name" x="180" y="343" text-anchor="middle">Unitree G1</text>

  <!-- Six tracked pedestrians and their predicted trajectories -->
  <g>
    <path class="prediction" d="M386 190Q411 168 441 160" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="414" cy="171" r="2.5"/><circle class="prediction-dot" cx="438" cy="161" r="2.5"/></g>
    <circle class="track" cx="386" cy="190" r="15"/><use href="#person" x="386" y="190"/>
    <rect x="367" y="166" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="386" y="176" text-anchor="middle" fill="var(--violet)">P01</text>
  </g>
  <g>
    <path class="prediction" d="M480 323Q476 287 482 252" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="478" cy="288" r="2.5"/><circle class="prediction-dot" cx="481" cy="255" r="2.5"/></g>
    <circle class="track" cx="480" cy="323" r="15"/><use href="#person" x="480" y="323"/>
    <rect x="461" y="339" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="480" y="349" text-anchor="middle" fill="var(--violet)">P02</text>
  </g>
  <g>
    <path class="prediction" d="M534 169Q556 195 570 225" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="555" cy="194" r="2.5"/><circle class="prediction-dot" cx="568" cy="222" r="2.5"/></g>
    <circle class="track" cx="534" cy="169" r="15"/><use href="#person" x="534" y="169"/>
    <rect x="515" y="145" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="534" y="155" text-anchor="middle" fill="var(--violet)">P03</text>
  </g>
  <g>
    <path class="prediction" d="M591 378Q619 354 647 339" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="619" cy="355" r="2.5"/><circle class="prediction-dot" cx="644" cy="341" r="2.5"/></g>
    <circle class="track" cx="591" cy="378" r="15"/><use href="#person" x="591" y="378"/>
    <rect x="572" y="394" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="591" y="404" text-anchor="middle" fill="var(--violet)">P04</text>
  </g>
  <g>
    <path class="prediction" d="M661 229Q642 258 631 290" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="644" cy="257" r="2.5"/><circle class="prediction-dot" cx="633" cy="287" r="2.5"/></g>
    <circle class="track" cx="661" cy="229" r="15"/><use href="#person" x="661" y="229"/>
    <rect x="642" y="205" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="661" y="215" text-anchor="middle" fill="var(--violet)">P05</text>
  </g>
  <g>
    <path class="prediction" d="M720 342Q699 319 684 294" marker-end="url(#arrow-violet)"/>
    <g class="future-pulse"><circle class="prediction-dot" cx="700" cy="320" r="2.5"/><circle class="prediction-dot" cx="686" cy="297" r="2.5"/></g>
    <circle class="track" cx="720" cy="342" r="15"/><use href="#person" x="720" y="342"/>
    <rect x="701" y="358" width="38" height="14" rx="7" fill="var(--violet-soft)"/><text class="micro" x="720" y="368" text-anchor="middle" fill="var(--violet)">P06</text>
  </g>

  <!-- Goal -->
  <circle class="goal-pulse" cx="810" cy="272" r="25" fill="none" stroke="var(--green)" stroke-width="2"/>
  <circle cx="810" cy="272" r="17" fill="var(--green-soft)" stroke="var(--green)" stroke-width="2"/>
  <circle cx="810" cy="272" r="5" fill="var(--green)"/>
  <text class="name" x="810" y="307" text-anchor="middle" fill="var(--green)">GOAL</text>

  <!-- Final hard-stop supervisor -->
  <rect class="card" x="900" y="76" width="272" height="376" rx="12" filter="url(#shadow)"/>
  <rect x="900" y="76" width="272" height="4" rx="2" fill="var(--red)"/>
  <text class="section" x="920" y="105" fill="var(--red)">FINAL INDEPENDENT GATE</text>
  <text class="name" x="920" y="130">Collision supervisor</text>
  <text class="detail" x="920" y="149">Checks the selected command against</text>
  <text class="detail" x="920" y="163">fresh scan data and hard limits.</text>

  <path d="M920 190H1152" stroke="var(--border)"/>
  <text class="micro" x="920" y="211">ILLUSTRATIVE OUTCOMES</text>
  <g class="state-pass">
    <rect x="920" y="225" width="104" height="31" rx="7" fill="var(--green-soft)" stroke="var(--green)"/>
    <circle cx="934" cy="240.5" r="4" fill="var(--green)"/><text class="name" x="944" y="245" fill="var(--green)">PASS</text>
  </g>
  <g class="state-stop">
    <rect x="1036" y="225" width="116" height="31" rx="7" fill="var(--red-soft)" stroke="var(--red)"/>
    <circle cx="1050" cy="240.5" r="4" fill="var(--red)"/><text class="name" x="1060" y="245" fill="var(--red)">STOP = ZERO</text>
  </g>
  <text class="detail" x="920" y="277">Indicators cycle only to show possible states.</text>
  <text class="detail" x="920" y="291">Runtime state is driven by live safety checks.</text>

  <rect x="920" y="315" width="232" height="70" rx="8" fill="var(--red-soft)" stroke="var(--red)"/>
  <path d="M938 335H949V346H938Z" fill="none" stroke="var(--red)" stroke-width="2"/>
  <path d="M941 338L947 344M947 338L941 344" stroke="var(--red)" stroke-width="1.5"/>
  <text class="name" x="960" y="342" fill="var(--red)">Hard stop remains authoritative</text>
  <text class="detail" x="938" y="363">Unsafe or stale input forces zero velocity,</text>
  <text class="detail" x="938" y="377">regardless of the planner's selected path.</text>
  <path d="M1036 394V414" stroke="var(--green)" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="950" y="414" width="172" height="24" rx="12" fill="var(--green-soft)"/>
  <text class="micro" x="1036" y="430" text-anchor="middle" fill="var(--green)">supervised /cmd_vel_safe</text>

  <!-- Processing chain and legend -->
  <g transform="translate(28 472)">
    <rect class="card" width="1144" height="66" rx="10"/>
    <g transform="translate(14 11)">
      <rect width="189" height="44" rx="8" fill="var(--cyan-soft)"/>
      <text class="section" x="12" y="17" fill="var(--cyan)">01  PERCEPTION</text>
      <text class="detail" x="12" y="34">scan → six tracked people</text>
    </g>
    <path d="M211 33H232" stroke="var(--cyan)" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(240 11)">
      <rect width="189" height="44" rx="8" fill="var(--violet-soft)"/>
      <text class="section" x="12" y="17" fill="var(--violet)">02  PREDICTION</text>
      <text class="detail" x="12" y="34">future pedestrian motion</text>
    </g>
    <path d="M437 33H458" stroke="var(--violet)" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
    <g transform="translate(466 11)">
      <rect width="189" height="44" rx="8" fill="var(--cyan-soft)"/>
      <text class="section" x="12" y="17" fill="var(--cyan)">03  SOCIAL PLANNING</text>
      <text class="detail" x="12" y="34">score candidates → select</text>
    </g>
    <path d="M663 33H684" stroke="var(--red)" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
    <g transform="translate(692 11)">
      <rect width="214" height="44" rx="8" fill="var(--red-soft)"/>
      <text class="section" x="12" y="17" fill="var(--red)">04  HARD-STOP SUPERVISION</text>
      <text class="detail" x="12" y="34">independent final command gate</text>
    </g>
    <g transform="translate(930 14)">
      <text class="micro" x="0" y="8">LEGEND</text>
      <path d="M0 21H24" class="selected"/><text class="micro" x="31" y="24">selected</text>
      <path d="M92 21H116" class="candidate"/><text class="micro" x="123" y="24">unsafe</text>
      <path d="M0 36H24" class="prediction"/><text class="micro" x="31" y="39">predicted</text>
      <circle class="track" cx="104" cy="36" r="6"/><text class="micro" x="116" y="39">tracked</text>
    </g>
  </g>
</svg>
