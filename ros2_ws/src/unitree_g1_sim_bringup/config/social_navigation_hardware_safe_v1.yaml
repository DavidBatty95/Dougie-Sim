# v1 cautious deployment starting point. This profile is not hardware-validated or safety-certified.
# Validate perception, stopping distance, latency, and robot dynamics before any hardware use.
dynamic_obstacle_tracker:
  ros__parameters:
    use_mujoco_people_detections: false
    mujoco_people_authoritative: false
    immediate_person_risk: true

human_aware_motion_planner:
  ros__parameters:
    tracked_persons_topic: /tracked_persons
    predicted_trajectories_topic: /predicted_person_trajectories
    use_legacy_person_inputs: false
    max_forward_near_human: 0.18
    max_lateral_near_human: 0.08
    max_reverse_velocity: 0.06
    max_angular_near_human: 0.35

human_collision_avoidance:
  ros__parameters:
    use_mujoco_people: false
    danger_radius: 2.00
    critical_radius: 1.25
    emergency_stop_radius: 0.90
    max_avoid_linear: 0.16
    max_reverse_linear: 0.08
    max_lateral_linear: 0.08
    max_avoid_angular: 0.35
