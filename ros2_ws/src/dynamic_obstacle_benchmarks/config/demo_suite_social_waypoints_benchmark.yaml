benchmark:
  name: social_reachable_waypoints
  seed: 42
  backend: mujoco
  headless: true
  use_sim_time: true
  total_timeout_s: 360.0
  output_dir: results/demo_suite

environment:
  name: pedestrian_plaza
  map_frame: world
  robot_frame: base_footprint
  bounds:
    x_min: -8.5
    x_max: 8.5
    y_min: -8.5
    y_max: 8.5

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.35
  max_speed_mps: 0.90
  goal_tolerance_m: 0.55
  max_goal_time_s: 90.0

people:
  count: 4
  radius_m: 0.42
  scenario: social_wandering_plaza
  spawn_min_distance_from_goal_m: 1.8

goals:
  # Mission targets use the clear central area; avoidance may use the full plaza.
  bounds: {x_min: -4.0, x_max: 3.0, y_min: -4.0, y_max: 4.0}
  count: 4
  mode: random
  min_distance_between_goals_m: 1.5
  max_distance_between_goals_m: 2.5
  max_heading_change_rad: 3.141592653589793
  min_distance_from_walls_m: 0.75
  max_sampling_attempts: 100
  path_validation_timeout_s: 3.0

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10

data_health:
  odom_stale_timeout_s: 1.0
  pedestrian_stale_timeout_s: 1.0
  scan_stale_timeout_s: 1.0
  require_exact_people_count: true

data_sources:
  control_people: mujoco_truth_oracle
  scoring_people: mujoco_simulator_truth
  scan: mujoco_raycast
