<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Geoff-Sim installation pipeline</title>
  <desc id="desc">An eight-stage installation pipeline: clone the repository, check host tools, pin submodules, enter the ROS 2 Humble image, install rosdep dependencies, build the ROS workspace with Unitree SDK2 and MuJoCo, verify the Unitree policy checksum, and become ready to run.</desc>
  <style>
    :root {
      --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --border:#d0d7de;
      --panel:#f6f8fa; --card:#ffffff;
      --cyan:#0086b3; --cyan-soft:#ddf4ff;
      --blue:#0969da; --blue-soft:#ddf4ff;
      --purple:#8250df; --purple-soft:#fbefff;
      --green:#1a7f37; --green-soft:#dafbe1;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
        --panel:#11161d; --card:#161b22;
        --cyan:#39c5cf; --cyan-soft:#073b4c;
        --blue:#58a6ff; --blue-soft:#0c2d6b;
        --purple:#bc8cff; --purple-soft:#35215d;
        --green:#3fb950; --green-soft:#12351d;
      }
    }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:var(--fg) }
    .title { font-size:24px; font-weight:750 }
    .subtitle { font-size:12px; fill:var(--muted) }
    .section { font-size:10px; font-weight:750; letter-spacing:.11em }
    .name { font-size:13px; font-weight:700 }
    .detail { font-size:10.5px; fill:var(--muted) }
    .mono { font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace }
    .panel { fill:var(--panel); stroke:var(--border); stroke-width:1 }
    .card { fill:var(--card); stroke:var(--border); stroke-width:1 }
    .edge { fill:none; stroke:var(--border); stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
    .pulse { fill:none; stroke:var(--blue); stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
      stroke-dasharray:9 91; stroke-dashoffset:9; animation:flow 7s linear infinite }
    .status-ring { fill:none; stroke-width:2; opacity:.28; transform-box:fill-box; transform-origin:center;
      animation:status 8s ease-out infinite }
    .s1 { animation-delay:0s } .s2 { animation-delay:1s } .s3 { animation-delay:2s }
    .s4 { animation-delay:3s } .s5 { animation-delay:4s } .s6 { animation-delay:5s }
    .s7 { animation-delay:6s } .s8 { animation-delay:7s }
    @keyframes flow { to { stroke-dashoffset:-91 } }
    @keyframes status {
      0%,7% { opacity:.25; transform:scale(.82) }
      12%,22% { opacity:.9; transform:scale(1.18) }
      30%,100% { opacity:.35; transform:scale(1) }
    }
    @media (prefers-reduced-motion:reduce) {
      .pulse { display:none }
      .status-ring { animation:none; opacity:.45 }
      .edge { stroke:var(--blue); opacity:.72 }
    }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-18%" width="120%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1f2328" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="var(--blue)"/>
    </marker>
  </defs>

  <rect width="1200" height="360" fill="var(--bg)"/>
  <text class="title" x="32" y="38">From clone to simulation</text>
  <text class="subtitle" x="32" y="58">A reproducible, pinned, and verified installation path for Unitree G1 · ROS 2 Humble · MuJoCo</text>
  <g transform="translate(1036 30)">
    <circle cx="8" cy="0" r="6" fill="var(--green-soft)" stroke="var(--green)"/>
    <path d="M5 0l2 2 4-5" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="subtitle" x="21" y="4">install pipeline</text>
  </g>

  <rect class="panel" x="28" y="82" width="1144" height="240" rx="12"/>
  <line x1="40" y1="83" x2="1160" y2="83" stroke="var(--blue)" stroke-width="3" stroke-linecap="round"/>
  <text class="section" x="44" y="104" fill="var(--blue)">SEQUENTIAL SETUP</text>

  <!-- Static route remains visible when animation is unavailable. -->
  <path class="edge" d="M300 148H332" marker-end="url(#arrow)"/>
  <path class="edge" d="M584 148H616" marker-end="url(#arrow)"/>
  <path class="edge" d="M868 148H900" marker-end="url(#arrow)"/>
  <path class="edge" d="M1152 148H1160V208H40V268H48" marker-end="url(#arrow)"/>
  <path class="edge" d="M300 268H332" marker-end="url(#arrow)"/>
  <path class="edge" d="M584 268H616" marker-end="url(#arrow)"/>
  <path class="edge" d="M868 268H900" marker-end="url(#arrow)"/>

  <path class="pulse" d="M300 148H332" pathLength="100"/>
  <path class="pulse" d="M584 148H616" pathLength="100" style="animation-delay:-1s"/>
  <path class="pulse" d="M868 148H900" pathLength="100" style="animation-delay:-2s"/>
  <path class="pulse" d="M1152 148H1160V208H40V268H48" pathLength="100" style="animation-delay:-3s"/>
  <path class="pulse" d="M300 268H332" pathLength="100" style="animation-delay:-4s"/>
  <path class="pulse" d="M584 268H616" pathLength="100" style="animation-delay:-5s"/>
  <path class="pulse" d="M868 268H900" pathLength="100" style="animation-delay:-6s"/>

  <g filter="url(#shadow)">
    <g>
      <rect class="card" x="48" y="112" width="252" height="72" rx="8"/>
      <rect x="48" y="112" width="5" height="72" rx="2.5" fill="var(--cyan)"/>
      <circle cx="72" cy="132" r="10" fill="var(--cyan-soft)"/>
      <circle class="status-ring s1" cx="72" cy="132" r="13" stroke="var(--cyan)"/>
      <text x="72" y="136" text-anchor="middle" font-size="10" font-weight="750" fill="var(--cyan)">1</text>
      <text class="name" x="91" y="136">Clone repo</text>
      <text class="detail mono" x="64" y="159">git clone</text>
      <text class="detail" x="64" y="174">fetch the installation source</text>
    </g>
    <g>
      <rect class="card" x="332" y="112" width="252" height="72" rx="8"/>
      <rect x="332" y="112" width="5" height="72" rx="2.5" fill="var(--blue)"/>
      <circle cx="356" cy="132" r="10" fill="var(--blue-soft)"/>
      <circle class="status-ring s2" cx="356" cy="132" r="13" stroke="var(--blue)"/>
      <text x="356" y="136" text-anchor="middle" font-size="10" font-weight="750" fill="var(--blue)">2</text>
      <text class="name" x="375" y="136">Host setup</text>
      <text class="detail" x="348" y="159">Git · curl · X11 · Docker</text>
      <text class="detail" x="348" y="174">install or verify required tools</text>
    </g>
    <g>
      <rect class="card" x="616" y="112" width="252" height="72" rx="8"/>
      <rect x="616" y="112" width="5" height="72" rx="2.5" fill="var(--purple)"/>
      <circle cx="640" cy="132" r="10" fill="var(--purple-soft)"/>
      <circle class="status-ring s3" cx="640" cy="132" r="13" stroke="var(--purple)"/>
      <text x="640" y="136" text-anchor="middle" font-size="10" font-weight="750" fill="var(--purple)">3</text>
      <text class="name" x="659" y="136">Pinned submodules</text>
      <text class="detail mono" x="632" y="159">git submodule update</text>
      <text class="detail" x="632" y="174">exact recursive revisions</text>
    </g>
    <g>
      <rect class="card" x="900" y="112" width="252" height="72" rx="8"/>
      <rect x="900" y="112" width="5" height="72" rx="2.5" fill="var(--cyan)"/>
      <circle cx="924" cy="132" r="10" fill="var(--cyan-soft)"/>
      <circle class="status-ring s4" cx="924" cy="132" r="13" stroke="var(--cyan)"/>
      <text x="924" y="136" text-anchor="middle" font-size="10" font-weight="750" fill="var(--cyan)">4</text>
      <text class="name" x="943" y="136">ROS 2 Humble image</text>
      <text class="detail mono" x="916" y="159">docker build</text>
      <text class="detail" x="916" y="174">reproducible container base</text>
    </g>

    <g>
      <rect class="card" x="48" y="232" width="252" height="72" rx="8"/>
      <rect x="48" y="232" width="5" height="72" rx="2.5" fill="var(--blue)"/>
      <circle cx="72" cy="252" r="10" fill="var(--blue-soft)"/>
      <circle class="status-ring s5" cx="72" cy="252" r="13" stroke="var(--blue)"/>
      <text x="72" y="256" text-anchor="middle" font-size="10" font-weight="750" fill="var(--blue)">5</text>
      <text class="name" x="91" y="256">rosdep dependencies</text>
      <text class="detail mono" x="64" y="279">rosdep install</text>
      <text class="detail" x="64" y="294">resolve ROS package requirements</text>
    </g>
    <g>
      <rect class="card" x="332" y="232" width="252" height="72" rx="8"/>
      <rect x="332" y="232" width="5" height="72" rx="2.5" fill="var(--purple)"/>
      <circle cx="356" cy="252" r="10" fill="var(--purple-soft)"/>
      <circle class="status-ring s6" cx="356" cy="252" r="13" stroke="var(--purple)"/>
      <text x="356" y="256" text-anchor="middle" font-size="10" font-weight="750" fill="var(--purple)">6</text>
      <text class="name" x="375" y="256">Build ROS workspace</text>
      <text class="detail mono" x="348" y="279">colcon build</text>
      <text class="detail" x="348" y="294">workspace + SDK2 + MuJoCo</text>
    </g>
    <g>
      <rect class="card" x="616" y="232" width="252" height="72" rx="8"/>
      <rect x="616" y="232" width="5" height="72" rx="2.5" fill="var(--green)"/>
      <circle cx="640" cy="252" r="10" fill="var(--green-soft)"/>
      <circle class="status-ring s7" cx="640" cy="252" r="13" stroke="var(--green)"/>
      <text x="640" y="256" text-anchor="middle" font-size="10" font-weight="750" fill="var(--green)">7</text>
      <text class="name" x="659" y="256">Verified Unitree policy</text>
      <text class="detail mono" x="632" y="279">SHA-256 checksum</text>
      <text class="detail" x="632" y="294">reject modified model artifacts</text>
    </g>
    <g>
      <rect x="900" y="232" width="252" height="72" rx="8" fill="var(--green-soft)" stroke="var(--green)" stroke-width="1.25"/>
      <rect x="900" y="232" width="5" height="72" rx="2.5" fill="var(--green)"/>
      <circle cx="924" cy="252" r="10" fill="var(--card)" stroke="var(--green)"/>
      <circle class="status-ring s8" cx="924" cy="252" r="13" stroke="var(--green)"/>
      <path d="M920 252l3 3 6-7" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="name" x="943" y="256" fill="var(--green)">Ready to run</text>
      <text class="detail mono" x="916" y="279">run_waypoint_navigation_demo.sh</text>
      <text class="detail" x="916" y="294">launch the simulation stack</text>
    </g>
  </g>

  <text class="subtitle" x="32" y="344">Numbered cards show the deterministic install order. Animated progress and status pulses are disabled when reduced motion is preferred.</text>
</svg>
