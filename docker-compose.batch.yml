name: dougie-seed-batch
services:
  batch:
    image: dougie-sim:mac-arm64
    platform: linux/arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.mac
    init: true
    user: dougie
    working_dir: /workspace
    command:
      - python3
      - -u
      - -m
      - dougie_sim.batch_comparison
      - --world
      - '${DOUGIE_BATCH_WORLD:-facility}'
      - --seed-count
      - '${DOUGIE_BATCH_SEEDS:-30}'
      - --seed-start
      - '${DOUGIE_BATCH_SEED_START:-1}'
      - --seed-axis
      - '${DOUGIE_BATCH_SEED_AXIS:-detector}'
      - --duration
      - '${DOUGIE_BATCH_DURATION:-0}'
      - --localization
      - '${DOUGIE_BATCH_LOCALIZATION:-ground-truth}'
      - --exposure-policy
      - '${DOUGIE_BATCH_EXPOSURE_POLICY:-responsive}'
      - --frontier-view-policy
      - '${DOUGIE_BATCH_FRONTIER_VIEW_POLICY:-raw}'
      - --workers
      - '${DOUGIE_BATCH_WORKERS:-1}'
      - --wall-timeout
      - '${DOUGIE_BATCH_WALL_TIMEOUT:-0}'
      - --output
      - '${DOUGIE_BATCH_OUTPUT:-results/dougie/facility_30_seeds}'
      - --resume
    environment:
      HOME: /home/dougie
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: '1'
      MUJOCO_GL: egl
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
      - .:/workspace
    shm_size: 1gb
    stop_signal: SIGINT
    stop_grace_period: 45s
