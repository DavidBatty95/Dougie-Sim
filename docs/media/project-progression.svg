<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 762" role="img" aria-labelledby="title desc">
  <title id="title">From simulation integration to delivery research</title>
  <desc id="desc">Publication milestones and dated experiments | Snapshot reviewed 5 October 2026. These are different experiment conditions, not a single performance curve. See docs/PROJECT_STATUS.md.</desc>
  <style>
    text {font-family:Arial,Helvetica,sans-serif}
    .marker {animation:glow 3s ease-in-out infinite}
    @keyframes glow {0%,100% {opacity:.6} 50% {opacity:1}}
    @media (prefers-reduced-motion:reduce) {.marker {animation:none}}
  </style>
  <rect width="1200" height="762" rx="20" fill="#0b1727"/>
  <rect x="34" y="32" width="5" height="56" rx="2" fill="#43d2ec"/>
  <text x="54" y="56" fill="#edf6ff" font-size="29" font-weight="bold">From simulation integration to delivery research</text>
  <text x="54" y="87" fill="#a8c1d6" font-size="16">Publication milestones and dated experiments | Snapshot reviewed 5 October 2026</text>
  <rect x="34" y="120" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="137" width="4" height="40" rx="2" fill="#43d2ec"/>
  <text x="54" y="152" fill="#43d2ec" font-size="21" font-weight="bold">01 / Simulation foundation</text>
  <text x="54" y="178" fill="#edf6ff" font-size="17">July 2026</text>
  <text x="54" y="206" fill="#b5c9dc" font-size="15">G1 integration, ROS interfaces and reproducible verification</text>
  <text x="54" y="226" fill="#b5c9dc" font-size="15">formed the initial platform.</text>
  <circle class="marker" cx="58" cy="271" r="4" fill="#43d2ec"/>
  <text x="70" y="275" fill="#43d2ec" font-size="11" font-weight="bold" letter-spacing="1">INTEGRATED</text>
  <rect x="614" y="120" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="137" width="4" height="40" rx="2" fill="#43d2ec"/>
  <text x="634" y="152" fill="#43d2ec" font-size="21" font-weight="bold">02 / Demonstration workflows</text>
  <text x="634" y="178" fill="#edf6ff" font-size="17">August 2026</text>
  <text x="634" y="206" fill="#b5c9dc" font-size="15">Locomotion, oracle social demos, manipulation interfaces and</text>
  <text x="634" y="226" fill="#b5c9dc" font-size="15">visual documentation expanded.</text>
  <circle class="marker" cx="638" cy="271" r="4" fill="#43d2ec"/>
  <text x="650" y="275" fill="#43d2ec" font-size="11" font-weight="bold" letter-spacing="1">DEMONSTRATED</text>
  <rect x="34" y="314" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="331" width="4" height="40" rx="2" fill="#7de39a"/>
  <text x="54" y="346" fill="#7de39a" font-size="21" font-weight="bold">03 / Onboard experiments</text>
  <text x="54" y="372" fill="#edf6ff" font-size="17">22 September 2026</text>
  <text x="54" y="400" fill="#b5c9dc" font-size="15">Six worlds and a results dashboard made onboard failures</text>
  <text x="54" y="420" fill="#b5c9dc" font-size="15">visible: v12 passed 4 of 18 trials.</text>
  <circle class="marker" cx="58" cy="465" r="4" fill="#7de39a"/>
  <text x="70" y="469" fill="#7de39a" font-size="11" font-weight="bold" letter-spacing="1">MEASURED</text>
  <rect x="614" y="314" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="331" width="4" height="40" rx="2" fill="#f4c978"/>
  <text x="634" y="346" fill="#f4c978" font-size="21" font-weight="bold">04 / Reliability investigation</text>
  <text x="634" y="372" fill="#edf6ff" font-size="17">September development records</text>
  <text x="634" y="400" fill="#b5c9dc" font-size="15">Iteration datasets and alignment audits retained regressions.</text>
  <text x="634" y="420" fill="#b5c9dc" font-size="15">v84 passed 10 of 18 trials.</text>
  <circle class="marker" cx="638" cy="465" r="4" fill="#f4c978"/>
  <text x="650" y="469" fill="#f4c978" font-size="11" font-weight="bold" letter-spacing="1">ACCEPTANCE OPEN</text>
  <rect x="34" y="508" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="34" y="525" width="4" height="40" rx="2" fill="#d3a5ff"/>
  <text x="54" y="540" fill="#d3a5ff" font-size="21" font-weight="bold">05 / Payload transport</text>
  <text x="54" y="566" fill="#edf6ff" font-size="17">25 September experiment report</text>
  <text x="54" y="594" fill="#b5c9dc" font-size="15">Two consecutive isolated fixture passes with a trained payload</text>
  <text x="54" y="614" fill="#b5c9dc" font-size="15">policy and magnetic attachment.</text>
  <circle class="marker" cx="58" cy="659" r="4" fill="#d3a5ff"/>
  <text x="70" y="663" fill="#d3a5ff" font-size="11" font-weight="bold" letter-spacing="1">ISOLATED EVIDENCE</text>
  <rect x="614" y="508" width="552" height="174" rx="12" fill="#14273b" stroke="#29425b"/>
  <rect x="614" y="525" width="4" height="40" rx="2" fill="#7de39a"/>
  <text x="634" y="540" fill="#7de39a" font-size="21" font-weight="bold">06 / Published development baseline</text>
  <text x="634" y="566" fill="#edf6ff" font-size="17">5 October 2026 | 3a7ceac</text>
  <text x="634" y="594" fill="#b5c9dc" font-size="15">Source, reviewed patches and evidence published together;</text>
  <text x="634" y="614" fill="#b5c9dc" font-size="15">regression checks documented.</text>
  <circle class="marker" cx="638" cy="659" r="4" fill="#7de39a"/>
  <text x="650" y="663" fill="#7de39a" font-size="11" font-weight="bold" letter-spacing="1">PUBLISHED</text>
  <text x="34" y="736" fill="#a8c1d6" font-size="13">These are different experiment conditions, not a single performance curve. See docs/PROJECT_STATUS.md.</text>
</svg>
