name: dougie-comparison
services:
  comparison:
    image: dougie-sim:mac-arm64
    platform: linux/arm64
    build:
      context: .
      dockerfile: docker/Dockerfile.mac
    init: true
    user: dougie
    working_dir: /workspace
    command:
      - python3
      - -u
      - -m
      - dougie_sim.comparison
      - --host
      - 0.0.0.0
      - --duration
      - '${DOUGIE_COMPARE_DURATION:-0}'
      - --localization
      - '${DOUGIE_COMPARE_LOCALIZATION:-ground-truth}'
      - --radiation-policy
      - '${DOUGIE_COMPARE_RADIATION_POLICY:-minimize-dose}'
      - --exposure-policy
      - '${DOUGIE_COMPARE_EXPOSURE_POLICY:-responsive}'
      - --route-dose-weight
      - '${DOUGIE_COMPARE_ROUTE_DOSE_WEIGHT:-1}'
      - --frontier-dose-weight
      - '${DOUGIE_COMPARE_FRONTIER_DOSE_WEIGHT:-2}'
      - --frontier-rate-limit
      - '${DOUGIE_COMPARE_FRONTIER_RATE_LIMIT:-100}'
      - --frontier-confidence
      - '${DOUGIE_COMPARE_FRONTIER_CONFIDENCE:-0.95}'
      - --frontier-view-policy
      - '${DOUGIE_COMPARE_FRONTIER_VIEW_POLICY:-raw}'
      - --world
      - '${DOUGIE_COMPARE_WORLD:-reactor}'
      - --seed
      - '${DOUGIE_COMPARE_SEED:-1}'
      - --feed-fps
      - '${DOUGIE_COMPARE_FPS:-5}'
    environment:
      HOME: /home/dougie
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: '1'
      MUJOCO_GL: egl
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      DOUGIE_COMPARE_LEARNING: '${DOUGIE_COMPARE_LEARNING:-0}'
      DOUGIE_COMPARE_CAMPAIGN: '${DOUGIE_COMPARE_CAMPAIGN:-0}'
      DOUGIE_COMPARE_CAMPAIGN_STRATEGY: '${DOUGIE_COMPARE_CAMPAIGN_STRATEGY:-baseline}'
      DOUGIE_COMPARE_LIFETIME_DOSE: '${DOUGIE_COMPARE_LIFETIME_DOSE:-}'
      DOUGIE_COMPARE_CAMPAIGN_SORTIES: '${DOUGIE_COMPARE_CAMPAIGN_SORTIES:-6}'
      DOUGIE_COMPARE_REPLAY: '${DOUGIE_COMPARE_REPLAY:-}'
    volumes:
      - .:/workspace
    ports:
      - '127.0.0.1:${DOUGIE_COMPARE_PORT:-8770}:8765'
    shm_size: 1gb
    stop_signal: SIGINT
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8765/api]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
