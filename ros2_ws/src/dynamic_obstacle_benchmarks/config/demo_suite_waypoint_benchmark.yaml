benchmark:
  name: demo_suite_forward_waypoints
  seed: 42
  backend: mujoco
  headless: true
  use_sim_time: true
  total_timeout_s: 480.0
  output_dir: results/demo_suite

environment:
  name: extreme_lab
  map_frame: map
  robot_frame: base_footprint
  bounds:
    x_min: -4.35
    x_max: 4.35
    y_min: -3.0
    y_max: 3.0

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.35
  max_speed_mps: 0.75
  goal_tolerance_m: 0.55
  max_goal_time_s: 120.0

people:
  count: 0
  radius_m: 0.30

goals:
  count: 4
  mode: random
  min_distance_between_goals_m: 1.5
  max_heading_change_rad: 1.4
  min_distance_from_walls_m: 0.75
  max_sampling_attempts: 100
  path_validation_timeout_s: 3.0

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10

data_health:
  odom_stale_timeout_s: 1.0
  pedestrian_stale_timeout_s: 1.0
  scan_stale_timeout_s: 1.0
  require_exact_people_count: true

data_sources:
  control_people: not_used
  scoring_people: not_used
  scan: mujoco_raycast
