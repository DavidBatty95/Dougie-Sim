schema_version: 1

experiment:
  id: mock_social_navigation_development
  description: Development-only matrix for batch and aggregation verification
  seed_partition: development_v1
  seeds: [1, 2]
  repetitions: 1
  timeout_s: 300
  output_root: ros2_ws/src/dynamic_obstacle_benchmarks/results/batches
  require_repository_output: true

invalid_trial_policy:
  infrastructure_reasons:
    - nav2_path_not_ready_before_scoring_start
    - nav2_not_ready_or_first_goal_rejected
    - transform_unavailable:world->map

provenance:
  files:
    - id: mock_wrapper
      path: scripts/run_person_avoidance_benchmark.sh
    - id: benchmark_config
      path: ros2_ws/src/dynamic_obstacle_benchmarks/config/person_avoidance_benchmark.yaml
    - id: scenario_presets
      path: ros2_ws/src/dynamic_obstacle_benchmarks/config/person_scenarios.yaml
  repositories:
    - id: workspace
      path: .
    - id: unitree_mujoco
      path: ros2_ws/src/unitree_mujoco
  container_services:
    - unitree-g1-sim

aggregation:
  confidence_level: 0.95
  reference_method: mock_reference
  continuous_metrics:
    - final_score
    - minimum_body_clearance_m
    - total_time_s
    - actual_path_length_m
  binary_metrics:
    - success
    - collisions
    - fallen
    - no_movement

methods:
  - id: mock_reference
    command:
      - scripts/run_person_avoidance_benchmark.sh
    args:
      - --backend
      - mock
      - --minimum-score
      - "0"

  - id: mock_repeatability
    command:
      - scripts/run_person_avoidance_benchmark.sh
    args:
      - --backend
      - mock
      - --minimum-score
      - "0"

scenarios:
  - id: crossing_smoke
    args:
      - --mode
      - crossing
      - --people
      - "2"
      - --goals
      - "2"
