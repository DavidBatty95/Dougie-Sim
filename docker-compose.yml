name: dougie-sim
services:
  dougie-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.dougie
    image: dougie-sim:humble
    user: "${DOUGIE_UID:-1000}:${DOUGIE_GID:-1000}"
    network_mode: host
    environment:
      HOME: /tmp
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/dougie.xauthority
      ROS_DOMAIN_ID: ${DOUGIE_ROS_DOMAIN_ID:-43}
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///workspace/config/dougie_cyclonedds.xml
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: '1'
      QT_X11_NO_MITSHM: '1'
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/dougie.xauthority:ro
    working_dir: /workspace
    stdin_open: true
    tty: true
