benchmark:
  name: person_avoidance_benchmark
  seed: 42
  backend: mock
  headless: true
  use_sim_time: true
  output_dir: results/person_avoidance
  record_rosbag: false

environment:
  name: default_people_avoidance_world
  map_frame: map
  robot_frame: base_link
  bounds:
    x_min: -5.0
    x_max: 5.0
    y_min: -5.0
    y_max: 5.0

robot:
  radius_m: 0.35
  nominal_speed_mps: 0.5
  max_speed_mps: 1.0
  goal_tolerance_m: 0.25
  max_goal_time_s: 60.0

people:
  count: 8
  radius_m: 0.30
  speed_min_mps: 0.2
  speed_max_mps: 1.2
  behaviours:
    - straight_line_crossing
    - random_waypoint
    - opposing_flow
    - stop_start
  spawn_min_distance_from_robot_m: 1.5
  spawn_min_distance_from_goal_m: 1.0
  spawn_min_distance_between_people_m: 0.8

goals:
  count: 10
  mode: random
  min_distance_between_goals_m: 2.0
  min_distance_from_walls_m: 0.5
  max_sampling_attempts: 1000

safety:
  warning_margin_m: 0.75
  near_miss_margin_m: 0.35
  critical_margin_m: 0.10
  near_miss_min_duration_s: 0.10
  ttc_horizon_s: 3.0
  ttc_warning_s: 1.50
  ttc_critical_s: 0.75

simulation:
  backend: mock
  launch_file: dynamic_obstacle_bringup benchmark_sim.launch.py
  reset_service: /simulation/reset
  spawn_person_service: /simulation/spawn_person
  set_person_trajectory_service: /simulation/set_person_trajectory
