<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dougie-Sim — explore, measure, return</title>
  <desc id="desc">Quadruped radiation mapping research. Animated scanning rings are a decorative schematic.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#0b1724"/><stop offset="1" stop-color="#183b4b"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#48daca" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <g fill="none" stroke="#48daca" transform="translate(975 147)">
    <circle r="108" opacity=".2"/><circle r="75" opacity=".4"/>
    <circle r="108" stroke-width="3" stroke-dasharray="120 560"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></circle>
    <path d="M-67-19H32L62-5V14H-60Z" fill="#183b4b" stroke-width="5"/>
    <path d="M-49 14L-64 43L-49 65M-19 14L-6 40L-18 65M22 14L10 41L23 65M44 14L60 42L48 65" stroke-width="7" stroke-linecap="round"/>
    <circle cx="49" cy="-5" r="4" fill="#ffbc66" stroke="none"/>
  </g>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="54" y="63" fill="#48daca" font-size="16" letter-spacing="4">QUADRUPED EXPLORATION RESEARCH</text>
    <text x="50" y="145" fill="#ecf5ff" font-size="72" font-weight="bold">Dougie-Sim</text>
    <text x="54" y="192" fill="#a7bdcf" font-size="23">Explore the unknown. Measure the field. Budget the return.</text>
    <text x="54" y="254" fill="#ffbc66" font-size="17">UNITREE GO2  /  MUJOCO  /  ROS 2  /  ONLINE RADIATION MAPPING</text>
  </g>
</svg>
